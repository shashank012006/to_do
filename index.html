<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Mode Tasker</title>
    <link rel="stylesheet" href="style.css">
    <script>document.addEventListener('DOMContentLoaded', () => {
        const input = document.getElementById('todo-input');
        const addBtn = document.getElementById('add-btn');
        const taskList = document.getElementById('task-list');
        const statsText = document.getElementById('stats-text');
    
        // 1. Update the Completed/Uncompleted counter
        const updateStats = () => {
            const allTasks = document.querySelectorAll('.task-item');
            const total = allTasks.length;
            const completed = document.querySelectorAll('.task-item.completed').length;
            const uncompleted = total - completed;
    
            statsText.textContent = `Completed: ${completed} | Uncompleted: ${uncompleted}`;
        };
    
        // 2. Create the HTML for a new task
        const createItemElement = (taskValue) => {
            const taskItem = document.createElement('div');
            taskItem.classList.add('task-item');
    
            taskItem.innerHTML = `
                <div class="task-content">
                    <input type="checkbox" class="task-checkbox">
                    <span>${taskValue}</span>
                </div>
                <div class="task-actions">
                    <button class="delete-btn">Delete</button>
                    <button class="edit-btn">Edit</button>
                </div>
            `;
    
            // Checkbox Toggle logic
            const checkbox = taskItem.querySelector('.task-checkbox');
            checkbox.addEventListener('change', () => {
                taskItem.classList.toggle('completed');
                updateStats();
            });
    
            // Delete Button logic
            taskItem.querySelector('.delete-btn').addEventListener('click', () => {
                taskItem.style.transform = "scale(0.9)";
                taskItem.style.opacity = "0";
                setTimeout(() => {
                    taskItem.remove();
                    updateStats();
                }, 200);
            });
    
            // Edit Button logic
            taskItem.querySelector('.edit-btn').addEventListener('click', () => {
                const span = taskItem.querySelector('span');
                const currentText = span.textContent;
                const newText = prompt("Edit your task:", currentText);
                
                if (newText !== null && newText.trim() !== "") {
                    span.textContent = newText.trim();
                }
            });
    
            return taskItem;
        };
    
        // 3. Handle Add Button click
        addBtn.addEventListener('click', () => {
            const val = input.value.trim();
            if (val !== "") {
                const newItem = createItemElement(val);
                taskList.appendChild(newItem);
                input.value = ""; // Clear input field
                updateStats();
            }
        });
    
        // 4. Handle "Enter" key press in input
        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                addBtn.click();
            }
        });
    
        // Initial run to set stats to 0|0
        updateStats();
    });</script>
</head>
<body>

    <div class="todo-container">
        <h1>To Do List</h1>
        
        <div class="input-group">
            <input type="text" id="todo-input" placeholder="Enter a task...">
            <button id="add-btn">Add</button>
        </div>

        <h2>Task List</h2>

        <div class="task-list" id="task-list"></div>

        <div class="footer">
            <p id="stats-text">Completed: 0 | Uncompleted: 0</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
